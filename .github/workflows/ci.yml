name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  # ── Go Server ──
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build server
        run: |
          VER=${GITHUB_REF##*/}
          [ -z "$VER" ] && VER="dev"
          CGO_ENABLED=1 go build -ldflags "-X github.com/mesnet/mesnet/internal/version.Current=${VER}" -o mesnet-server ./cmd/server/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesnet-server
          path: mesnet-server

  # ── Go Agent (Linux) ──
  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build agent (linux/amd64)
        run: |
          VER=${GITHUB_REF##*/}
          [ -z "$VER" ] && VER="dev"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/mesnet/mesnet/internal/version.Current=${VER}" -o mesnet-agent-linux-amd64 ./cmd/agent/

      - name: Build agent (linux/arm64)
        run: |
          VER=${GITHUB_REF##*/}
          [ -z "$VER" ] && VER="dev"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X github.com/mesnet/mesnet/internal/version.Current=${VER}" -o mesnet-agent-linux-arm64 ./cmd/agent/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesnet-agent-linux
          path: mesnet-agent-linux-*

  # ── Go Agent (macOS) ──
  agent-darwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build agent (darwin/amd64)
        run: |
          VER=${GITHUB_REF##*/}
          [ -z "$VER" ] && VER="dev"
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/mesnet/mesnet/internal/version.Current=${VER}" -o mesnet-agent-darwin-amd64 ./cmd/agent/

      - name: Build agent (darwin/arm64)
        run: |
          VER=${GITHUB_REF##*/}
          [ -z "$VER" ] && VER="dev"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X github.com/mesnet/mesnet/internal/version.Current=${VER}" -o mesnet-agent-darwin-arm64 ./cmd/agent/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesnet-agent-darwin
          path: mesnet-agent-darwin-*

  # ── React Frontend ──
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build
        run: npm ci && npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesnet-web
          path: web/dist

  # ── Release (on tag push) ──
  release:
    needs: [server, agent-linux, agent-darwin, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Package web dist
        run: cd mesnet-web && tar czf ../mesnet-web.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            mesnet-agent-linux/mesnet-agent-linux-*
            mesnet-agent-darwin/mesnet-agent-darwin-*
            mesnet-server/mesnet-server
            mesnet-web.tar.gz
          draft: false
          generate_release_notes: true
